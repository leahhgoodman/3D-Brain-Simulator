<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex Atlas · Interactive Brain</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1019;color:#f2f1fa;font:16px system-ui,sans-serif}header,main,footer{max-width:1200px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;border-bottom:1px solid #2a3044;font-size:.75rem;letter-spacing:.2em;color:#b9aaff}h1{font-size:clamp(2.6rem,6vw,5.6rem);letter-spacing:-.07em;line-height:1;margin:14px 0}p{color:#bac0d5;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:16px;margin-top:26px}.stage,aside{border:1px solid #2a3044;border-radius:20px;background:#141828}.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#282644,#121625 76%)}canvas{display:block;width:100%;height:clamp(320px,46vw,570px);touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.badge,.hint,#tip{position:absolute;font-size:.74rem;pointer-events:none}.badge{top:18px;left:18px;letter-spacing:.14em;color:#c7baff}.hint{bottom:18px;left:18px;color:#bac0d5}#tip{z-index:1;background:#111422;border:1px solid #434961;border-radius:10px;padding:10px;width:min(210px,65%);line-height:1.45}#tip strong{display:block;margin-bottom:4px}aside{padding:20px}h2{margin:0 0 12px;font-size:1.15rem}button{font:inherit;color:inherit;background:#191e31;border:1px solid #353b53;border-radius:9px;padding:9px;cursor:pointer}button:focus-visible{outline:2px solid #cabaff}#regions{display:grid;gap:6px}#regions button{text-align:left;display:flex;align-items:center;gap:9px}#regions button[aria-pressed=true]{border-color:var(--tone);background:#292641}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--tone)}#detail{min-height:105px;font-size:.9rem;margin-top:16px}#detail strong{color:white}.controls{display:flex;gap:6px;flex-wrap:wrap}footer{font-size:.8rem;color:#bac0d5}a{color:#c7baff}@media(max-width:740px){.layout{grid-template-columns:1fr}header,main,footer{padding:16px}}
</style>
<header><strong>CORTEX ATLAS</strong><span>INTERACTIVE ANATOMY</span></header>
<main>
<h1>Explore the brain</h1>
<p>Rotate the model and hover over a colored region to see what it does.</p>
<div class="layout">
<div class="stage"><canvas id="brain" aria-label="Rotatable schematic of the human brain. Use the rotation and region buttons to explore it."></canvas><span class="badge">01 / BRAIN MODEL</span><span class="hint">DRAG TO ROTATE · TAP A REGION</span><div id="tip" hidden></div></div>
<aside><h2>Brain regions</h2><div id="regions"></div><p id="detail" aria-live="polite">Choose a region to learn about its role.</p><div class="controls"><button id="left" aria-label="Rotate left">←</button><button id="right" aria-label="Rotate right">→</button><button id="up" aria-label="Tilt up">↑</button><button id="down" aria-label="Tilt down">↓</button><button id="reset">Reset view</button></div></aside>
</div>
</main>
<footer>Schematic model with approximate boundaries. <a href="https://www.ninds.nih.gov/health-information/public-education/brain-basics/brain-basics-know-your-brain">Brain Basics from NINDS</a></footer>
<script>
const regions = [
  ['Frontal lobe','#ff887f','Helps with planning, decision-making, and voluntary movement.'],
  ['Parietal lobe','#ffd174','Processes touch and helps you understand where your body is in space.'],
  ['Temporal lobe','#52d8bd','Helps process sound, understand language, and form memories.'],
  ['Occipital lobe','#a99aff','Processes visual information such as shape, color, and motion.'],
  ['Cerebellum','#6dafff','Coordinates movement and helps maintain balance and posture.'],
  ['Brainstem','#e892cc','Connects the brain to the spinal cord and helps regulate breathing and heart rate.']
];
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const tip = document.querySelector('#tip');
const detail = document.querySelector('#detail');
let yaw = .28, pitch = .26, pinned = -1, hovered = -1, faces = [], drag;
const mesh = [];
function surface(rows, cols, point, identify) {
  const grid = Array.from({length:rows+1}, (_,i) =>
    Array.from({length:cols+1}, (_,j) => point(Math.PI*i/rows, 2*Math.PI*j/cols)));
  for(let i=0;i<rows;i++) for(let j=0;j<cols;j++){
    const vertices = [grid[i][j],grid[i+1][j],grid[i+1][j+1],grid[i][j+1]];
    const middle = vertices[0].map((_,axis) => vertices.reduce((sum,p)=>sum+p[axis],0)/4);
    mesh.push({vertices, region:identify(middle)});
  }
}
for(const side of [-1,1]){
  surface(80,128,(t,p)=>{
    const x=Math.cos(t), y=Math.sin(t)*Math.cos(p), z=Math.sin(t)*Math.sin(p);
    const ridge=Math.cos(24*y+3*Math.sin(7*x+3*z)+2*Math.sin(11*x-5*z))
      * .022 + Math.cos(37*x+6*Math.sin(8*y)+5*z)*.013;
    return [x*(1.82+ridge), .24+y*(1.02+ridge)+.11*x,
      side*(.54+z*(.52+ridge)+.10*(1-x*x))];
  },([x,y])=> x< -1.02+.23*y ? 3 : y<-.12+.15*Math.sin(2*x) && x<.9 ? 2 : x>.23+.31*y ? 0 : 1);
}
for(const side of [-1,1]){
  surface(42,64,(t,p)=>{
    const x=Math.cos(t),y=Math.sin(t)*Math.cos(p),z=Math.sin(t)*Math.sin(p);
    const ripple=.021*Math.cos(63*y+8*x*x+4*z*z);
    return [-.87+x*.67,-.68+y*(.42+ripple),side*(.37+z*(.38+ripple))];
  },()=>4);
}
surface(30,48,(t,p)=>[.12-.18*Math.cos(t)+.24*Math.sin(t)*Math.cos(p),
  -.82+.67*Math.cos(t),.23*Math.sin(t)*Math.sin(p)],()=>5);
const rgb=regions.map(([,hex])=>hex.slice(1).match(/../g).map(v=>parseInt(v,16)));
function draw(){
  const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio,2);
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const scale=Math.min(w/4.3,h/3.7);
  faces=[];
  for(const {vertices,region} of mesh){
    const view=vertices.map(([x,y,z])=>{
      const depth=z*cy-x*sy;
      return [x*cy+z*sy,y*cp-depth*sp,y*sp+depth*cp];
    });
    const [a,b,c]=view;
    const u=b.map((v,i)=>v-a[i]),v=c.map((value,i)=>value-a[i]);
    let nx=u[1]*v[2]-u[2]*v[1],ny=u[2]*v[0]-u[0]*v[2],nz=u[0]*v[1]-u[1]*v[0];
    const length=Math.hypot(nx,ny,nz);
    if(length<1e-9)continue;
    if(nz<0){nx=-nx;ny=-ny;nz=-nz}
    const light=.53+.44*Math.max(0,(-.35*nx+.48*ny+.80*nz)/length);
    const points=view.map(([x,y,z])=>{
      const perspective=7/(7-z);
      return [w/2+x*scale*perspective,h/2-y*scale*perspective];
    });
    faces.push({points,depth:view.reduce((sum,p)=>sum+p[2],0)/4,region,light});
  }
  faces.sort((a,b)=>a.depth-b.depth);
  const active=hovered>=0?hovered:pinned;
  for(const face of faces){
    const {points,region,light}=face;
    const factor=light*(active<0?1:active===region?1.13:.62);
    const color='rgb('+rgb[region].map(c=>Math.min(255,Math.round(c*factor))).join(',')+')';
    ctx.beginPath();ctx.moveTo(...points[0]);for(const p of points.slice(1))ctx.lineTo(...p);
    ctx.closePath();ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=.55;ctx.fill();ctx.stroke();
  }
}
function hit(x,y){
  for(let i=faces.length-1;i>=0;i--){
    const {points,region}=faces[i];let inside=false;
    for(let a=0,b=points.length-1;a<points.length;b=a++){
      const [ax,ay]=points[a],[bx,by]=points[b];
      if((ay>y)!==(by>y)&&x<(bx-ax)*(y-ay)/(by-ay)+ax)inside=!inside;
    }
    if(inside)return region;
  }
  return -1;
}
const buttons=regions.map(([name,color],i)=>{
  const button=document.createElement('button');
  button.style.setProperty('--tone',color);
  button.innerHTML='<span class="dot"></span>'+name;
  button.setAttribute('aria-pressed','false');
  button.onclick=()=>select(pinned===i?-1:i);
  document.querySelector('#regions').append(button);
  return button;
});
function describe(node,i){
  node.replaceChildren();
  const heading=document.createElement('strong');heading.textContent=regions[i][0];
  node.append(heading,document.createElement('br'),regions[i][2]);
}
function select(i){
  pinned=i;hovered=-1;tip.hidden=true;
  buttons.forEach((button,index)=>button.setAttribute('aria-pressed',String(index===i)));
  if(i<0)detail.textContent='Choose a region to learn about its role.';
  else describe(detail,i);
  draw();
}
canvas.onpointerdown=e=>{
  if(e.button!==0||drag)return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,yaw,pitch,moved:false};
  canvas.setPointerCapture(e.pointerId);tip.hidden=true;
};
canvas.onpointermove=e=>{
  if(drag){
    if(e.pointerId!==drag.id)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.hypot(dx,dy)>4)drag.moved=true;
    if(drag.moved){yaw=drag.yaw+dx*.012;pitch=drag.pitch+dy*.012;hovered=-1;draw()}
    return;
  }
  const i=hit(e.offsetX,e.offsetY);
  if(i!==hovered){hovered=i;if(i>=0)describe(tip,i);draw()}
  tip.hidden=i<0;
  if(i>=0){
    tip.style.left=Math.max(6,Math.min(e.offsetX+14,canvas.clientWidth-tip.offsetWidth-6))+'px';
    tip.style.top=Math.max(6,Math.min(e.offsetY+14,canvas.clientHeight-tip.offsetHeight-6))+'px';
  }
};
canvas.onpointerup=e=>{
  if(drag?.id!==e.pointerId)return;
  if(!drag.moved)select(hit(e.offsetX,e.offsetY));
  drag=undefined;
};
canvas.onlostpointercapture=()=>{drag=undefined};
canvas.onpointerleave=()=>{tip.hidden=true;if(hovered>=0){hovered=-1;draw()}};
for(const [id,x,y] of [['left',-.35,0],['right',.35,0],['up',0,-.35],['down',0,.35]]){
  document.querySelector('#'+id).onclick=()=>{yaw+=x;pitch+=y;draw()};
}
document.querySelector('#reset').onclick=()=>{yaw=.28;pitch=.26;select(-1)};
new ResizeObserver(draw).observe(canvas);
</script>
</html>
